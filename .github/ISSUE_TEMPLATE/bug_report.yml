name: Bug report / 问题反馈
description: Report a reproducible timing, classification, queue or lifecycle problem.
body:
  - type: input
    id: build
    attributes:
      label: Build ID and game layout/version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Weapon, handedness, tool, FPS, distance, Shift/F7 state
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Expected / actual behavior and minimal reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence and unknowns
      description: Do not upload raw sessions, account identifiers, endpoints, memory addresses or local paths.
